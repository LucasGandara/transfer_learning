# start or keep
load_model: false

# Model Names
actor_model_name: td3_expert_actor_right_main_track
critic_1_model_name: td3_expert_critic_1_right_main_track
critic_2_model_name: td3_expert_critic_2_right_main_track

expert_actor_model_name: td3_expert_actor_right_main_track
expert_critic_model_name: td3_expert_critic_1_right_main_track

# Env
stage: 0 # 0: main track rigth, 1: tb3 world, 2: main track left

# Reward function
w_angular: 2.0
w_distance: 3.0
alpha_reward: 0.5

# DRL Agent
agent: TD3TL
critic_lr: 0.005
actor_lr: 0.001
gamma: 0.99
tau: 0.005
std_dev: 0.2

batch_size: 128
current_episode: 0
num_episodes: 200
max_steps_per_episode: 500
reward_decay_factor: 0.01
episode_step: 200
save_model_every: 30
aggregate_stats_every: 10
memory_size: 1000000
max_linear_vel: 1.5
max_angular_vel: 2.2

# DQN Agent
min_epsilon: 0.1
epsilon_decay: 0.999

# Logs
base_log_dir: logs
model_save_base_path: keras_models
model_save_path: keras_models/ddpg_tb3.keras
SHOW_QS_VALUES: true

# Miscelanious
log_level: INFO
